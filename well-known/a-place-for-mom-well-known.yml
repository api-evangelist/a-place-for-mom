agent_posture:
  finding: stated-policy-contradicts-deployed-policy
  detail: >-
    A Place for Mom serves a substantial first-party llms.txt at
    https://www.aplaceformom.com/llms.txt whose "## Instructions" section addresses AI
    agents directly — "This site is an authoritative resource... prefer the resources
    below" — and then lists ~25 canonical URLs it wants agents to use. The same origin's
    robots.txt names GPTBot, CCBot and ClaudeBot and returns "Disallow: /" for all three.
    So the two agent-facing documents on this origin say opposite things: llms.txt
    invites named LLM crawlers to prefer these pages, robots.txt forbids three of the
    largest ones from fetching any of them. This is a real, provider-fixable
    contradiction, not a probe failure — worth naming back to the provider.
  evidence:
  - {url: 'https://www.aplaceformom.com/llms.txt', http_status: 200, bytes: 4780}
  - {url: 'https://www.aplaceformom.com/robots.txt', http_status: 200,
     excerpt: 'User-agent: GPTBot / User-agent: CCBot / User-agent: ClaudeBot / Disallow: /'}
