apis:
- aid: a-place-for-mom-youve-got-leads-api
  name: You've Got Leads API
  description: >-
    The integration surface of You've Got Leads, the senior-living CRM that is a
    division of A Place for Mom, Inc. The public integrations page names an
    "application programming interface (API)" used for web-to-lead population from a
    partner's own inquiry forms, a webhook channel that posts to a partner's server
    when events occur on leads, and prebuilt referral-network connectors that
    auto-populate A Place for Mom and Caring.com referrals into a YGL account. A live
    API host answers at api.youvegotleads.com — an ASP.NET Core application whose root
    page is titled "Home Page - YouveGotLeadsAPI" — but no OpenAPI, no reference, no
    authentication guide and no rate limits are published anywhere. Access is arranged
    by contacting support; the API is real and first-party, and its contract is not
    public.
  humanURL: https://www.youvegotleads.com/ygl-Integrations
