name: A Place for Mom
description: >-
  A Place for Mom is North America's largest senior living referral service,
  connecting families with assisted living, memory care, independent living,
  home care, and other senior care options through a network of Senior Living
  Advisors and a large marketplace of care communities. Families use the service
  at no cost to search, compare, and get matched to providers, while care
  communities and home care agencies partner with A Place for Mom to receive
  and manage referral leads, respond to and moderate consumer reviews, and track
  billing and performance through provider-facing portals. A Place for Mom was
  surfaced as a portfolio company of Battery Ventures and Insight Partners and
  added to the API Evangelist network for enrichment. The company operates
  consumer-facing web properties plus provider, community-partner, reputation,
  and home care portals, and publishes a support knowledge base (including an
  llms.txt documentation index) rather than a public developer API program.
